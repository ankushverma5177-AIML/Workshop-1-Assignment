<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multimedia</title></head>
<body>
  <h4>Image</h4>
  <img src="media/college.jpg" width="300" height="180">
  
  <h4>Video</h4>
  <video controls width="320">
    <source src="media/earth vid.mp4" type="video/mp4">
  </video>

  <h4>Audio</h4>
  <audio controls>
    <source src="media/audio.mp3" type="audio/mpeg">
  </audio>
  
  <h4>YouTube</h4>
  <iframe width="320" height="180"
    src="https://youtube.com/embed/XPk2CzOyXzQ?si=OxyiwbFHnO_IvOk6"
    title="Sample YouTube video" allowfullscreen></iframe>
</body>
</html>
